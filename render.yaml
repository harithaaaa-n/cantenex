services:
  - type: web
    name: cantenex-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ENVIRONMENT
        value: production
      - key: ADMIN_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: cantenex-db
          property: connectionString

databases:
  - name: cantenex-db
    databaseName: cantenex
    user: cantenex_user
    plan: free
